context:
  name: calday
  version: "1.1.0"
  python_min: "3.12"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://gitlab.com/earthscope/public/epic/passoft/calday/-/archive/v${{ version }}/calday-v${{ version }}.tar.gz
  sha256: a8eac5df6b839a734dc5b6a278be61d397ddf514052429379e8a82c807f93f43

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - calday = calday.calday:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - calday
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - calday 123 2026
  - script:
      - python -m unittest discover -s tests
    requirements:
      run:
        - python ${{ python_min }}.*
    files:
      source:
        - tests/

about:
  homepage: https://epic.earthscope.org/content/software-resources
  summary: Convert between Julian day-of-year and calendar date
  description: |
    calday is a small command-line utility that converts a Julian
    day-of-year and year into the corresponding calendar date.
    It is commonly used in seismic data archiving workflows that
    label files by Julian day.
  license: GPL-3.0-or-later
  license_file: LICENSE
  repository: https://gitlab.com/earthscope/public/epic/passoft/calday

extra:
  recipe-maintainers:
    - omid-earthscope
